name: ai_high_restore
warning: "High generative restoration may alter factual details."
crop:
  enabled: true
  min_area_ratio: 0.01
  keep_border_px: 0
orientation:
  auto_rotate: true
  min_confidence: 0.7
repair:
  defect_inpaint:
    enabled: true
    model: api
    backend_hint: sdxl_inpaint
  global_restore:
    enabled: true
    model: api
    backend_hint: supir_or_faithdiff
  face_restore:
    enabled: true
    model: codeformer
    fidelity: 0.4
  super_resolution:
    enabled: true
    model: api
    backend_hint: high_quality_sr
color:
  white_balance: true
  contrast: high
