[project]
name = "photo-restorer"
version = "0.1.0"
description = "Scan old-photo crop, correction and restoration pipeline with CLI/API/UI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "Pillow>=10", "torch>=2.0", "torchvision>=0.15"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "PyYAML>=6"]
desktop = ["PySide6>=6.6", "opencv-python>=4.8", "Pillow>=10", "torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
photo-restorer = "photo_restorer.cli:main"
photo-restorer-ui = "pyside_ui.pyside_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend", "apps"]

[tool.setuptools.package-data]
photo_restorer = ["presets/*.yaml"]
